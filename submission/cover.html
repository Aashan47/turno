<style>
:root{--paper:#F4F5F2;--ink:#1E1A15;--muted:#6F6A61;--rule:#D8D6CE;--soft:#E9EAE5;
  --cool:#7FA6BC;--warm:#E4B94A;--hot:#EE6A2C;--danger:#B9231C;--stop:#5A0E12;--amd:#C8102E}
*{box-sizing:border-box}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.page{position:relative;width:1920px;height:1080px;padding:96px 120px}
.wordmark{font-size:168px;font-weight:800;letter-spacing:-0.045em;line-height:.9;margin:0;font-variation-settings:"opsz" 96}
.tag{font-size:46px;font-weight:500;letter-spacing:-0.015em;margin:28px 0 0;color:var(--ink)}
.strip{position:absolute;left:120px;right:120px;bottom:168px;margin:0}
.strip svg{width:100%;height:auto;display:block}
.legend{position:absolute;left:120px;bottom:92px;display:flex;gap:34px;font-size:22px;color:var(--muted)}
.legend i{display:inline-block;width:26px;height:16px;border-radius:3px;margin-right:10px;vertical-align:-1px}
.sw-heat{background:linear-gradient(90deg,var(--cool),var(--warm),var(--hot),var(--danger))}
.sw-ban{background:repeating-linear-gradient(135deg,var(--ink) 0 3px,transparent 3px 8px)}
.sw-hand{border:2px dashed var(--ink);background:transparent}
.event{position:absolute;right:120px;bottom:92px;font-size:22px;color:var(--muted);text-align:right}
.event b{color:var(--ink);font-weight:700}
</style>
</head>
